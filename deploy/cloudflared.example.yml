# Cloudflare Tunnel 설정 예시 — 이 파일을 cloudflared.yml 로 복사해 값을 채운다.
#
# 🔴 기존 서비스의 ~/.cloudflared/config.yml 은 건드리지 않는다.
#    반드시 --config 로 이 파일을 지정해 실행한다.
#
#    cloudflared --config deploy/cloudflared.yml tunnel run cardnews
#
# credentials-file 은 `cloudflared tunnel create` 가 만든 JSON 이다.
# 비밀 파일이므로 저장소에 넣지 않는다.

tunnel: cardnews
credentials-file: C:\Users\<사용자>\.cloudflared\<터널UUID>.json

ingress:
  - hostname: cardnews.example.com
    service: http://127.0.0.1:8765
  # 마지막 규칙은 반드시 catch-all 이어야 한다
  - service: http_status:404
